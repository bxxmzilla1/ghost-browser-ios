name: tweak

on:
  push:
    paths:
      - 'Heavenzy/**'
      - '.github/workflows/tweak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Fetch iOS SDK (sparse)
        run: |
          set -e
          rm -rf "$THEOS/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git "$THEOS/sdks"
          cd "$THEOS/sdks"
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          ls -1 "$THEOS/sdks"

      - name: Build rootless .deb
        run: |
          cd Heavenzy
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Collect package
        run: |
          mkdir -p out
          cp Heavenzy/packages/*.deb out/
          ls -la out

      - name: Verify package contents (tweak dylib + control app + libSandy profile)
        run: |
          set -e
          deb=$(ls out/*.deb | head -n1)
          dpkg -c "$deb" | tee contents.txt
          grep -q 'Library/MobileSubstrate/DynamicLibraries/Heavenzy.dylib' contents.txt
          grep -q 'Library/MobileSubstrate/DynamicLibraries/Heavenzy.plist' contents.txt
          grep -q 'Applications/Heavenzy.app/Heavenzy$' contents.txt
          grep -q 'Applications/Heavenzy.app/Info.plist' contents.txt
          # Must be exactly /var/jb/Library/libSandy/Heavenzy.plist — a doubled var/jb prefix means
          # sandyd will never find the profile.
          grep -Eq '(^|[ ./])var/jb/Library/libSandy/Heavenzy\.plist$' contents.txt
          if grep -q 'var/jb/var/jb' contents.txt; then echo "ERROR: doubled var/jb prefix in payload"; exit 1; fi
          echo "OK: dylib, filter plist, app binary, Info.plist and libSandy profile all present"

      - uses: actions/upload-artifact@v4
        with:
          name: Heavenzy-deb
          path: out/*.deb
          if-no-files-found: error
