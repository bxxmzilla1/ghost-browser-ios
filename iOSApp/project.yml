name: GhostBrowser
options:
  bundleIdPrefix: com.sideload.ghostbrowser
  deploymentTarget:
    iOS: "15.0"
targets:
  GhostBrowser:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GhostBrowser
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Websites may request the camera for photo or video capture.
        NSMicrophoneUsageDescription: Websites may request the microphone for calls or recordings.
        NSPhotoLibraryUsageDescription: Used when a website asks you to pick a photo to upload.
        NSMotionUsageDescription: Websites may request device motion data.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - instagram
          - instagram-stories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideload.ghostbrowser.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: GhostBrowser
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
